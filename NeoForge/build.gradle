plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "de.maxhenkel.cursegradle" version "1.5.+"
    id "com.modrinth.minotaur" version "2.+"
}
neoForge {
    version = neoforge_version


    def additionalATs = [project(":Common").file("src/main/resources/META-INF/common_accesstransformer.cfg")].findAll {it.exists()}
    if (!additionalATs.isEmpty()) {
        accessTransformers.from(additionalATs.toArray(new File[0]))
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

curseforge {

    def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")
    if (curseforgeToken) {
        apiKey = curseforgeToken
    }

    project {
        id = project.curseforge_project_id
        changelogType = "markdown"
        changelog = project.ext.changelog
        releaseType = project.release_type
        "${project.supported_versions}".split(',').each {
            addGameVersion "${it}"
        }
        addGameVersion "NeoForge"
        addGameVersion "Java ${java_version}"

        mainArtifact(tasks.jar) {
            displayName = "[NeoForge] $project.mod_name $project.mod_version+$project.minecraft_version"
        }
        addArtifact(sourcesJar)
    }
}

modrinth {
    projectId = project.modrinth_project_id
    versionName = "[NeoForge] $project.mod_name $project.mod_version+$project.minecraft_version"
    versionNumber = "neoforge-${project.mod_version}+${project.minecraft_version}"
    versionType = project.release_type
    changelog = project.ext.changelog
    uploadFile = jar
    additionalFiles = [sourcesJar]
    gameVersions = "${project.supported_versions}".split(',') as List<String>
    loaders = ["neoforge"]
}